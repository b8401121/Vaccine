<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>疫苗查詢系統</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>疫苗查詢系統</h1>
      <p>請輸入您的出生年月日，為您列出建議施打的疫苗</p>
    </header>

    <main>
      <div class="card form-card">
        <form id="dob-form">
          <div class="toggle-container">
            <label class="toggle">
              <input type="checkbox" id="calendar-toggle">
              <span class="slider"></span>
            </label>
            <span id="calendar-label">目前使用：西元</span>
          </div>

          <div class="input-group">
            <div class="field">
              <label for="year">年份</label>
              <input type="number" id="year" required placeholder="如: 1990">
            </div>
            <div class="field">
              <label for="month">月份</label>
              <select id="month" required></select>
            </div>
            <div class="field">
              <label for="day">日期</label>
              <select id="day" required></select>
            </div>
            <div class="field">
              <label>性別</label>
              <div class="gender-radio-group">
                <label class="radio-label">
                  <input type="radio" name="gender" value="female" checked>
                  <span>♀ 女性</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="gender" value="male">
                  <span>♂ 男性</span>
                </label>
              </div>
            </div>
          </div>
          
          <button type="submit" class="btn-primary">查詢疫苗</button>
        </form>
      </div>

      <div id="results" class="results-container hidden">
        <div class="results-header">
          <h2>疫苗垂直時間軸 (Timeline)</h2>
          <div id="age-badge" class="age-badge">目前年齡：--</div>
        </div>
        <div class="legend">
          <span class="tag routine">公費常規</span>
          <span class="tag self-paid">自費建議</span>
          <span class="status-pill past-pill">✓ 歷史已過站點</span>
          <span class="status-pill current-pill clickable" id="jump-to-current" title="點擊直接跳轉至當前站點">📍 當前推薦站點 🎯</span>
          <span class="status-pill next-pill">⏳ 未來預計站點</span>
        </div>

        <div id="timeline-container" class="vertical-timeline"></div>
      </div>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
