<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣疫苗接種建議時程查詢</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="icon">💉</span>
        <h1>台灣預防接種指南助手</h1>
      </div>
      <p class="subtitle">自動試算兒童與成人公自費疫苗時程 ‧ 衛福部疾管署官方標準</p>
      
      <!-- 頂部頁籤分頁導覽 -->
      <nav class="top-nav-tabs">
        <button class="tab-btn active" data-target="tab-calculator">🗓️ 生日試算與時間軸</button>
        <button class="tab-btn" data-target="tab-library" id="tab-btn-library">📚 疫苗大百科與完整時程庫</button>
      </nav>
    </header>

    <main class="main-content">
      <!-- 分頁 1：生日試算與時間軸 -->
      <section id="tab-calculator" class="tab-page active">
        <div class="card search-card">
          <h2>📅 請選擇出生日期與性別</h2>
          
          <form id="dob-form">
            <div class="calendar-switch">
              <span class="switch-label">曆法選取：</span>
              <label class="toggle">
                <input type="checkbox" id="calendar-toggle">
                <span class="slider"></span>
              </label>
              <span id="calendar-type-text" class="type-text">西元年 (AD)</span>
            </div>

            <div class="input-group">
              <div class="field">
                <label for="year">年份</label>
                <input type="number" id="year" required placeholder="如: 1990">
              </div>
              <div class="field">
                <label for="month">月份</label>
                <select id="month" required></select>
              </div>
              <div class="field">
                <label for="day">日期</label>
                <select id="day" required></select>
              </div>
              <div class="field">
                <label>性別</label>
                <div class="gender-radio-group">
                  <label class="radio-label">
                    <input type="radio" name="gender" value="female" checked>
                    <span>♀ 女性</span>
                  </label>
                  <label class="radio-label">
                    <input type="radio" name="gender" value="male">
                    <span>♂ 男性</span>
                  </label>
                </div>
              </div>
              <div class="field">
                <label for="location">居住縣市 (地方特惠/補助)</label>
                <select id="location">
                  <option value="臺北市" selected>臺北市 (含輪狀/男國中生補助)</option>
                  <option value="新北市">新北市 (含男國中生補助)</option>
                  <option value="基隆市">基隆市</option>
                  <option value="桃園市">桃園市 (含長者/男國中生補助)</option>
                  <option value="新竹市">新竹市</option>
                  <option value="新竹縣">新竹縣</option>
                  <option value="苗栗縣">苗栗縣</option>
                  <option value="臺中市">臺中市</option>
                  <option value="彰化縣">彰化縣</option>
                  <option value="南投縣">南投縣</option>
                  <option value="雲林縣">雲林縣</option>
                  <option value="嘉義市">嘉義市</option>
                  <option value="嘉義縣">嘉義縣</option>
                  <option value="臺南市">臺南市</option>
                  <option value="高雄市">高雄市</option>
                  <option value="屏東縣">屏東縣</option>
                  <option value="宜蘭縣">宜蘭縣</option>
                  <option value="花蓮縣">花蓮縣</option>
                  <option value="臺東縣">臺東縣</option>
                  <option value="澎湖縣">澎湖縣</option>
                  <option value="金門縣">金門縣 (離島加碼補助)</option>
                  <option value="連江縣">連江縣 (馬祖離島補助)</option>
                  <option value="全國標準">全國標準 / 其他縣市</option>
                </select>
              </div>
            </div>
            
            <button type="submit" class="btn-primary">查詢疫苗時程與縣市補助</button>
          </form>
        </div>

        <div id="results" class="results-container hidden">
          <div class="results-header">
            <h3>疫苗接種時間軸</h3>
            <div id="age-badge" class="age-badge">目前年齡：--</div>
          </div>
          <div class="legend">
            <span class="tag routine">公費常規</span>
            <span class="tag subsidized">🏛️ 地方縣市補助</span>
            <span class="tag self-paid">💰 自費建議</span>
            <span class="status-pill past-pill">✓ 歷史已過站點</span>
            <span class="status-pill current-pill clickable" id="jump-to-current" title="點擊直接跳轉至當前站點">📍 當前推薦站點 🎯</span>
            <span class="status-pill next-pill">⏳ 未來預計站點</span>
          </div>

          <!-- 垂直時間軸容器 -->
          <div class="vertical-timeline" id="timeline-container">
            <!-- 由 JS 動態渲染卡片與站點 -->
          </div>
        </div>
      </section>

      <!-- 分頁 2：疫苗大百科與完整時程庫 -->
      <section id="tab-library" class="tab-page hidden">
        <div class="card library-header-card">
          <div class="library-top-bar">
            <h2>📚 全台疫苗總覽與衛教資訊大百科</h2>
            <p>點擊任何疫苗卡片即可查閱詳細預防疾病、公自費資格、劑次與施打禁忌。</p>
          </div>

          <div class="library-filter-bar">
            <div class="search-input-wrapper">
              <span class="search-icon">🔍</span>
              <input type="text" id="library-search" placeholder="搜尋疫苗名稱、別名或預防疾病 (如: HPV, 腸病毒, 帶狀疱疹)...">
            </div>

            <div class="filter-chips">
              <button class="chip active" data-filter="all">全部疫苗</button>
              <button class="chip" data-filter="Routine">公費常規</button>
              <button class="chip" data-filter="SelfPaid">自費建議</button>
              <button class="chip" data-filter="child">兒童/幼兒</button>
              <button class="chip" data-filter="adult">成人/長者</button>
            </div>
          </div>
        </div>

        <!-- 疫苗圖鑑網格 -->
        <div id="library-grid" class="library-grid">
          <!-- 由 JS 動態填入疫苗卡片 -->
        </div>
      </section>
    </main>

    <!-- 疫苗詳細介紹與時程 Modal 彈出視窗 -->
    <div id="vaccine-modal" class="modal-overlay hidden">
      <div class="modal-card fade-in">
        <button class="modal-close-btn" id="modal-close">✕</button>
        <div id="modal-content">
          <!-- 內容由 JS 動態生成 -->
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <p>資料來源：衛生福利部疾病管制署 (Taiwan CDC) 預防接種時程與自費疫苗建議指引</p>
    </footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
